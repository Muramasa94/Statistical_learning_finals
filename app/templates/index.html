<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Analysis Web</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    {% for css in customCSS %}
        <link href="{{ url_for('static', filename='css/' ~ css) }}" rel="stylesheet">
    {% endfor %}
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Emotion Analysis Web</h1>

        <div class="row">
            <!-- Input Section -->
            <div class="col-md-7">
                <form id="input-form">
                    <div class="mb-3">
                        <label for="inputText" class="form-label"><strong>Enter Text:</strong></label>
                        <textarea class="form-control" id="inputText" name="text" rows="10" placeholder="Type or paste your text here..." required></textarea>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn btn-primary" onclick="analyzeText()">Analyze Emotions</button>
                    </div>
                </form>
            </div>

            <!-- Result Section -->
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-center mb-3">Emotion Breakdown</h5>

                            <!-- Emotion Results Dynamically displayed using javascript here-->
                             
                            <p class="text-muted text-center">Results will appear here after analysis.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <!-- Sweetalert js-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom JS -->
    {% for js in customJS %}
    <script src="{{ url_for('static', filename='js/' ~ js) }}"></script>
    {% endfor %}
</body>
</html>
